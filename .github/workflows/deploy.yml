name: Déploiement sur Render

# Déclencheurs : quand on pousse sur la branche main
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. On récupère le code
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. On installe Node.js (optionnel si tu veux tester avant)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. (Optionnel mais fortement recommandé) On installe les dépendances et on build pour vérifier que tout va bien
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 4. (Optionnel) Lancer les tests si tu en as
      # - name: Run tests
      #   run: npm run test

      # 5. Déclencher le déploiement sur Render via le Deploy Hook
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}